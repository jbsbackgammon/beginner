<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#075b4a">
<title>初級戦管理</title><link rel="stylesheet" href="style.css">
</head><body>
<header class="topbar">
  <div class="wrap top-inner">
    <nav class="tabs" aria-label="管理画面">
      <button data-tab="players" class="active">選手管理</button>
      <button data-tab="entry">進行管理</button>
      <button data-tab="export">成績管理</button>
    </nav>
    <div class="header-controls">
      <div class="header-event">
        <select id="header-event" aria-label="対象大会"></select>
      </div>
      <div class="header-json">
        <button type="button" class="header-json-button" data-header-action="backup">JSON出力</button>
        <button type="button" class="header-json-button" data-header-action="load">JSON取込</button>
        <button type="button" class="header-json-button header-delete" data-header-action="delete-all">全削除</button>
      </div>
    </div>
  </div>
</header>
<main class="wrap"><div id="notice" role="status" aria-live="polite"></div><section id="app"></section></main>
<div id="print-area" aria-hidden="true"></div>
<script type="module" src="src/app.js"></script>
</body></html>
